name = "flow-incident"

# The one path the separate verifier collects from the agent's final container. A top-level
# key on purpose: Harbor ignores an artifacts list placed under [verifier].
artifacts = [
    "/app/flowkit/src/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Security"
subcategory = "Forensics"
tags = ["zig", "netflow", "incident-response", "clock-skew", "tcp"]
languages = ["zig"]
difficulty = "core"
expert_time_estimate_hours = 5
is_multi_container = true
difficulty_explanation = """
The agent writes a Zig tool that reconstructs a data theft incident from the flow records two routers exported to a collector. The two routers and the collector each tell the story slightly wrong, in ways the spec states as facts and leaves to the agent. The edge router samples one packet in N and says so in its header, so its counts and times are of the sampled packets; the core router counts every packet but has never been on NTP, so its clock sits whole seconds from true time; the core was power cycled once, so its boot counter and flow sequence restarted; the collector lost export packets from each router, restarted once and re-sent the last minutes of its spool, so some export packets are in the archive twice with a later arrival time; and both boot counters are 32-bit and wrap inside the archive. Nothing in the three archives came off a real network: solution/generate_archive.py makes the traffic, both flow caches, the packet bytes and the expected report from a rule book written down first.

The reconstruction is the work. On the shipped archive the core clock is 667 seconds ahead, so grouping records on the raw clocks puts a connection's two routers minutes apart and gets 41 of the 42 report fields wrong; adding both routers' counts gets 35 wrong; keying the re-sent copies on the flow sequence, 38 wrong; resolving a re-sent copy by the later arrival and reading the clock per packet, 30; counting the copies again, 32; leaving the sampled counts unscaled or ignoring the edge router, 27, since only it saw the traffic during the outage; cutting connections on the routers' 15 second timeout instead of the site's five minute port reuse, 32; counting a connection by any overlap with the window, 6; taking the collector's arrival stamp as the record time, 6; subtracting the boot counter without wrapping, 3; and the five-minute boundary, the window's end and the boot split, one each. Each of the twenty-one misreadings measured, over eight fresh seeds of each archive, still gets a field wrong on every seed that carries its case, and the held-back archive has another network, window and names, one packet in eight and a clock 1420 seconds out.

Each fact is simple alone and none is hard to implement once seen. What makes an expert slow is that they interact: the clock error decides which records are one connection, the connection decides which router's count stands, the sampling decides whether a count is scaled, the re-sent copies decide which arrival gives the clock error, and the power cycle decides how lost records are counted, so a report can look plausible, agree with every self-check the agent can run on the box, and still be wrong on the archive it cannot see. This is the job of the analyst who owns network forensics at a site with more than one exporter: knowing why two exporters disagree before adding their numbers up.
"""
solution_explanation = """
solve.sh places solution/src/main.zig under src and compiles it exactly as the grader does. The tool connects with the standard library's TCP client to the host name or address in ARCHIVE_HOST, asks for the case, and follows the page tokens the archive hands out until it answers end, keeping every export packet once by its bytes with the earliest arrival time, since a re-sent copy is the same bytes arriving later. Each router's clock error is read as arrival minus header on those earliest copies, rounded to whole seconds, and the median taken, which is the one value they all give. The router's packets are ordered by its own clock and split into boots where the boot counter stops running with that clock or the sequence falls, and within each boot the sequence gaps between consecutive packets are summed into the lost count. Every record is put on the true clock as the header's clock, less the clock error, less the 32-bit wrapping distance from the header's boot counter to the record's First and Last. Records are sorted by flow key and start and walked into connections, a new one whenever the next record of the same flow key starts five minutes or more after the latest end so far; a connection's bytes are the core's byte counts summed when the core has any record of it and otherwise N times the edge router's. Connections whose start falls in the window are then counted into the two tables, outbound per inside source host with an outside destination and lateral per inside destination the suspect connected to, with the earliest start as the first contact, and the report is written as one line. Its output equals the rule book's report on all three archives. The rule book is Python, in solution/generate_archive.py, written before the Zig and independently of it; calibrate.py runs that rule book with one reading at a time switched to a plausible wrong one and counts the fields that move.
"""
verification_explanation = """
The verifier container collects only /app/flowkit/src and runs tests/test.sh, then tests/test_outputs.py. Twenty-four checks run over three graded runs. Before each run the verifier compiles the tool itself from a root-owned copy of the sources. Only Zig is compiled: every path under src that is not a .zig file is deleted and the compiler is given main.zig as the root with no other flag and no libc, so an object, an embedded data file or a build script beside it never reaches the compiler.

Nothing is recomputed at grading time. The goldens are the reports the rule book in solution/generate_archive.py wrote in advance, baked into the verifier image, root-only, beside the reports the compiled Zig reference produced from the same archives at generation time; one check requires the two to be identical, so the oracle is cross-checked by two independent implementations of SPEC.md. Each run is pointed at an archive the verifier starts from the copy in that image, on a port and page size the agent's environment never used. Run one is the shipped archive on 127.0.0.2; run two a 1.5 MB archive the agent has never seen, one packet in eight and a core clock 1420 seconds behind, so a report carrying the shipped figures fails before a row is compared; run three a small archive reached by a host name, whose core sequence after the power cycle rises past the old boot's, with no re-sent packets and the suspect's inside connections outside the window. Each report must be one line, and every outbound row, every lateral row with its first contact time and both lost counts are compared with exact equality.

The agent's code is compiled and run in the container holding the goldens, so both go through setpriv as an unprivileged user with groups cleared; the tests, the archives, the service and the log directory are closed to that user and probed first, and a run that can still reach one scores 0; the tool is started through a seccomp launcher (tests/launch.c) that refuses it and its children any other exec; every entry on root's PATH must be root-owned and closed to others; pytest starts by absolute path with -P, every file the tests open carries O_NOFOLLOW, and only root writes the reward.

Coverage is counted. One check per archive parses the packets and requires the edge router's headers to say sampled and the core's not, the clock error read off arrival minus header to be zero on the edge and the stated whole seconds on the core, two boots on the core, re-sent copies and colliding sequences where the archive has them and none where it does not, a wrapped boot counter, a core record starting exactly at each window edge, and on the held-back archive two lateral hosts first contacted in the same millisecond. Another requires the archive's log to show every run asking for the case and fetching every page with a token the archive handed out (they are random), and the third reaching it by name.

Eighteen wrong variants live outside it; all scored 0 through this verifier and the reference 1, and calibrate.py measures the twenty-one readings the rule book can express over three archives and eight fresh seeds.
"""
relevant_experience = """
I have done network forensics for a site that exported flow records from more than one router into one collector, and every incident write-up started with the same three questions this task turns on: which exporter's clock is right, which one is sampled, and whether the collector's archive holds each export packet once. The core switch that was never put on NTP, the edge box that sampled one packet in a few, the collector that replayed its spool after a restart and the boot counter that wrapped mid-investigation are all things I have had to explain before anyone would believe a byte count. The working rule I keep from the tasks of mine this collection has taken is that a stated fact is only tested once data exists on which that fact alone, misread, changes the graded answer.
"""

[verifier]
timeout_sec = 3600
environment_mode = "separate"
network_mode = "public"

[agent]
timeout_sec = 5400
network_mode = "public"

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
